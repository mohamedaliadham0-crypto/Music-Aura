name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Verify Project Structure & Build
      run: |
        echo "Checking repository contents..."
        ls -la
        
        if [ ! -d "app" ]; then
          echo "Creating default 'app' module structure..."
          mkdir -p app/src/main
          echo 'android { namespace "com.music.aura" compileSdk 34 }' > app/build.gradle.kts
        fi

        if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
          echo 'include(":app")' > settings.gradle.kts
        fi

        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.5 || echo "Using system gradle fallback"
        fi
        
        chmod +x gradlew || true
        
        # Run build if gradle wrapper exists, otherwise create a mock artifact for inspection
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          echo "Gradle wrapper unavailable. Listing files for debugging:"
          find . -maxdepth 3
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
