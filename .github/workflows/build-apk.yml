name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Setup Android Project Files & Wrapper
      run: |
        # Ensure the 'app' module exists with a valid build configuration
        if [ ! -d "app" ]; then
          mkdir -p app/src/main
          echo 'android { namespace "com.music.aura" compileSdk 34 }' > app/build.gradle.kts
        fi

        # Ensure settings file exists
        if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
          echo 'include(":app")' > settings.gradle.kts
        fi

        # Download/Create the Gradle Wrapper files directly if gradlew is missing
        if [ ! -f "./gradlew" ]; then
          echo "Setting up Gradle wrapper..."
          mkdir -p gradle/wrapper
          
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF

          # Download official gradle wrapper script template
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5/gradlew -o gradlew
          chmod +x gradlew
          
          # Download wrapper jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5/subprojects/ide/src/main/resources/org/gradle/plugins/ide/internal/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
