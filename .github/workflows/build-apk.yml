name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create env files if missing
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        if [ ! -f .env.example ]; then
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example
        fi
        echo "GEMINI_API_KEY=${GEMINI_API_KEY:-MY_GEMINI_API_KEY}" > .env

    - name: Create debug keystore if missing
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Create placeholder google-services.json if missing
      run: |
        if [ ! -f app/google-services.json ]; then
          cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "music-aura-placeholder",
            "storage_bucket": "music-aura-placeholder.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.example.auramusic" }
              },
              "oauth_client": [],
              "api_key": [ { "current_key": "placeholder" } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }
          ],
          "configuration_version": "1"
        }
        EOF
        fi

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make sure the Gradle wrapper exists
      run: |
        if [ ! -f gradlew ]; then
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')
          else
            VERSION=8.9
          fi
          gradle wrapper --gradle-version "$VERSION"
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
