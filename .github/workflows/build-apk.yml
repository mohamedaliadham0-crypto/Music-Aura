name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make sure the Gradle wrapper exists
      run: |
        if [ ! -f gradlew ]; then
          echo "gradlew not found, generating it..."
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')
          else
            VERSION=8.9
          fi
          gradle wrapper --gradle-version "$VERSION"
        fi
        chmod +x gradlew

    - name: Build Debug APK
      env:
        # Only needed if your app uses an API key (see .env.example)
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
