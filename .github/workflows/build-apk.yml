name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Create Gradle Wrapper Files
      run: |
        if [ ! -f "./gradlew" ]; then
          # Create settings file if missing
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo 'include(":app")' > settings.gradle.kts
            echo 'rootProject.name = "Music-Aura"' >> settings.gradle.kts
          fi

          # Generate the wrapper properties and script using Maven Central or direct curl
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF

          # Download wrapper jar or use gradle runner fallback
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5/subprojects/ide/src/main/resources/org/gradle/plugins/ide/internal/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar || true
          
          # Fallback script creation if gradlew isn't generated
          cat << 'EOF' > gradlew
#!/usr/bin/env sh
exec gradle "$@"
EOF
          chmod +x gradlew
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
